[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "holdem-vision-analyzer"
version = "0.6.0"
description = "Local vision model and pixel-based Texas Hold'em desktop analyzer"
requires-python = ">=3.12,<3.13"
dynamic = ["dependencies"]

[project.scripts]
holdem-vision = "src.main:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
